# renew_before_expiry = 30 days
version = 2.11.0
archive_dir = /etc/letsencrypt/archive/demo.ssp-protection.fr
cert = /etc/letsencrypt/live/demo.ssp-protection.fr/cert.pem
privkey = /etc/letsencrypt/live/demo.ssp-protection.fr/privkey.pem
chain = /etc/letsencrypt/live/demo.ssp-protection.fr/chain.pem
fullchain = /etc/letsencrypt/live/demo.ssp-protection.fr/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 82b830bbfd9a5986688a0ee0cb661f91
authenticator = webroot
webroot_path = /var/www/certbot,
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[[webroot_map]]
demo.ssp-protection.fr = /var/www/certbot
